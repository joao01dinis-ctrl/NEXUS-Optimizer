name: Windows build and tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore NexusOptimizer.sln --configfile NuGet.Config
      - name: Build
        run: dotnet build NexusOptimizer.sln -c Release --no-restore
      - name: Test
        run: dotnet test src/Nexus.Tests/Nexus.Tests.csproj -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory artifacts/tests
      - name: Publish unsigned portable app
        run: dotnet publish src/Nexus.UI/Nexus.UI.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/app
      - name: Verify resources and prepare distribution
        shell: pwsh
        run: |
          foreach ($name in @('Nexus.UI.exe', 'Nexus.Core.dll', 'App.xbf', 'MainWindow.xbf', 'Nexus.UI.pri')) {
            if (!(Test-Path "artifacts/app/$name")) { throw "Missing publication file: $name" }
          }
          Copy-Item LICENSE,README.md,PRIVACY.md,CODE_SIGNING.md,THIRD_PARTY_NOTICES.md artifacts/app
          Compress-Archive -Path artifacts/app/* -DestinationPath artifacts/NEXUS-Optimizer-win-x64-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Optimizer-win-x64-unsigned
          path: artifacts/NEXUS-Optimizer-win-x64-unsigned.zip
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/tests
          if-no-files-found: warn
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NEXUS-Optimizer-win-x64-unsigned
          path: artifacts
      - name: Publish experimental prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $notes = 'Experimental unsigned Windows x64 build. Windows application control may block it. Profiles only change app monitoring intervals. Full GUI validation on the original development PC remains blocked; see README and VALIDATION.md. No Windows security protections are disabled.'
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG artifacts/NEXUS-Optimizer-win-x64-unsigned.zip --clobber
          } else {
            gh release create $env:RELEASE_TAG artifacts/NEXUS-Optimizer-win-x64-unsigned.zip --verify-tag --prerelease --title "NEXUS Optimizer $env:RELEASE_TAG (experimental, unsigned)" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
