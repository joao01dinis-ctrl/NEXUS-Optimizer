name: Windows build and tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore NexusOptimizer.sln --configfile NuGet.Config
      - name: Build
        run: dotnet build NexusOptimizer.sln -c Release --no-restore
      - name: Check tracked distribution inputs for accidental credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in (git ls-files)) {
            if ($file -match '(^|/)\.env($|\.)' -and $file -notmatch '\.example$') { throw 'A private environment file is tracked.' }
            if ($file -match '\.(pfx|p12|key|pem)$') { throw 'Private key material must not be distributed.' }
            if ($file -match '\.(cs|json|md|yml|yaml|ps1|cmd|props|xml|config)$') {
              $text = Get-Content -LiteralPath $file -Raw
              if ($text -match '(sk-proj-[A-Za-z0-9_-]{35,}|gh[pousr]_[A-Za-z0-9]{30,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)') { throw "Potential credential detected in $file; contents withheld." }
            }
          }
      - name: Test
        shell: pwsh
        run: |
          dotnet test src/Nexus.Tests/Nexus.Tests.csproj -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory artifacts/tests
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          [xml]$result = Get-Content artifacts/tests/tests.trx -Raw
          if ([int]$result.TestRun.ResultSummary.Counters.executed -eq 0) { throw 'No tests executed.' }
      - name: Verify native preference and restore on the disposable runner
        env:
          NEXUS_TEST_NATIVE_PREFERENCE: '1'
        run: dotnet test src/Nexus.Tests/Nexus.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~NativePreferenceTests|FullyQualifiedName~MousePrecisionNativeTests" --logger "trx;LogFileName=native-preference.trx" --results-directory artifacts/tests
      - name: Publish unsigned portable app
        run: dotnet publish src/Nexus.UI/Nexus.UI.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/app
      - name: Verify resources and prepare distribution
        shell: pwsh
        run: |
          foreach ($name in @('Nexus.UI.exe', 'Nexus.Core.dll', 'App.xbf', 'MainWindow.xbf', 'Nexus.UI.pri')) {
            if (!(Test-Path "artifacts/app/$name")) { throw "Missing publication file: $name" }
          }
          Copy-Item LICENSE,README.md,USAGE.md,PRIVACY.md,CODE_SIGNING.md,THIRD_PARTY_NOTICES.md,FEATURES.md,VIDEO-FEATURES.md,TL-PARITY.md,TIKTOK-REVIEW.md,FPS-VALIDATION.md,FIVEM-VALIDATION.md,VALIDATION.md,DESIGN-08.md,VALIDATION-08.md,AUDIT-09.md,NEXOS-VPN-STUDY.md,VALIDATION-09.md,PROTECTION.md,VPN-IMPLEMENTATION.md,MOUSE-LAB.md artifacts/app
          Compress-Archive -Path artifacts/app/* -DestinationPath artifacts/NEXUS-Optimizer-win-x64-unsigned.zip
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          Copy-Item artifacts/NEXUS-Optimizer-win-x64-unsigned.zip "artifacts/NEXUS-Optimizer-$version-win-x64-unsigned.zip"
          Get-FileHash "artifacts/NEXUS-Optimizer-$version-win-x64-unsigned.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content artifacts/SHA256SUMS.txt
          [ordered]@{ Version = $version; Commit = $env:GITHUB_SHA; Signed = $false; StoreCertification = 'NOT PERFORMED'; LocalWindowsLaunch = 'NOT VERIFIED'; Payload = "NEXUS-Optimizer-$version-win-x64-unsigned.zip" } | ConvertTo-Json | Set-Content artifacts/distribution.json
      - name: Prepare the unsigned Store candidate without installing it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = Import-PowerShellDataFile StorePreparation/PartnerCenterIdentity.psd1
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.FileVersion
          & ./StorePreparation/Build-StorePackage.ps1 -IdentityName $identity.IdentityName -Publisher $identity.Publisher -PublisherDisplayName $identity.PublisherDisplayName -AppDisplayName $identity.AppDisplayName -PartnerCenterIdentityConfirmed -PackageVersion $version -SourceDirectory artifacts/app
          $reportFile = Get-ChildItem StorePreparation/builds -Recurse -Filter packaging-report.json | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$reportFile) { throw 'Store packaging report missing.' }
          $report = Get-Content -LiteralPath $reportFile.FullName -Raw | ConvertFrom-Json
          if ($report.MakeAppxExitCode -ne 0 -or $report.Signed -or $report.Installed -or $report.StoreSubmitted) { throw 'Unexpected Store candidate state.' }
          New-Item -ItemType Directory -Path artifacts/store-candidate -Force | Out-Null
          Copy-Item -LiteralPath $report.Package -Destination artifacts/store-candidate
          Copy-Item -LiteralPath $reportFile.FullName -Destination artifacts/store-candidate
          Copy-Item -LiteralPath (Join-Path $reportFile.DirectoryName 'input-files.json') -Destination artifacts/store-candidate
          $package = Get-ChildItem artifacts/store-candidate -Filter '*.msix' | Select-Object -First 1
          if ((Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash -ne $report.PackageSHA256) { throw 'Store candidate hash mismatch.' }
      - name: Check startup and render the new pages without applying tweaks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Screenshot display changes require a disposable hosted runner.' }
          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Linq;
          using System.Runtime.InteropServices;
          public static class NexusHostedDesktop {
              [StructLayout(LayoutKind.Explicit, Size=220)]
              public struct Mode {
                  [FieldOffset(68)] public ushort Size;
                  [FieldOffset(70)] public ushort Extra;
                  [FieldOffset(72)] public uint Fields;
                  [FieldOffset(168)] public uint Bits;
                  [FieldOffset(172)] public uint Width;
                  [FieldOffset(176)] public uint Height;
              }
              [DllImport("user32.dll", EntryPoint="EnumDisplaySettingsW", CharSet=CharSet.Unicode)]
              static extern bool Enumerate(string device, int index, ref Mode mode);
              [DllImport("user32.dll", EntryPoint="ChangeDisplaySettingsExW", CharSet=CharSet.Unicode)]
              static extern int Change(string device, ref Mode mode, IntPtr window, uint flags, IntPtr parameter);
              static Mode original;
              static bool changed;
              static Mode Current() { var m=new Mode { Size=220 }; if (!Enumerate(null,-1,ref m)) throw new InvalidOperationException("Cannot read hosted display mode."); return m; }
              public static string Prepare() {
                  original=Current();
                  if (original.Width>=1600 && original.Height>=1000) return original.Width+"x"+original.Height;
                  var candidates=new List<Mode>();
                  for (int i=0;i<1000;i++) { var m=new Mode { Size=220 }; if (!Enumerate(null,i,ref m)) break; if (m.Width>=1600 && m.Height>=1000 && m.Bits==32) candidates.Add(m); }
                  foreach (var candidate in candidates.OrderBy(m=>(long)m.Width*m.Height)) {
                      var mode=candidate; mode.Fields=0x00080000|0x00100000;
                      if (Change(null,ref mode,IntPtr.Zero,2,IntPtr.Zero)!=0) continue;
                      if (Change(null,ref mode,IntPtr.Zero,0,IntPtr.Zero)!=0) continue;
                      changed=true; var actual=Current();
                      if (actual.Width>=1600 && actual.Height>=1000) return actual.Width+"x"+actual.Height;
                  }
                  throw new InvalidOperationException("The hosted display has no usable Store-size mode; real screenshot validation cannot proceed.");
              }
              public static void Restore() { if (changed && Change(null,ref original,IntPtr.Zero,0,IntPtr.Zero)!=0) throw new InvalidOperationException("Could not restore the hosted desktop mode."); changed=false; }
          }
          '@
          try {
            Write-Host ([NexusHostedDesktop]::Prepare())
            $env:NEXUS_STORE_SCREENSHOT = '1'
            $scenarios = @(
              @{ Page = 'overview'; Light = '0'; Analyze = '1' },
              @{ Page = 'overview'; Light = '1'; Analyze = '0' },
              @{ Page = 'precision'; Light = '0'; Analyze = '0' },
              @{ Page = 'settings'; Light = '0'; Analyze = '0' },
              @{ Page = 'optimize'; Light = '0'; Analyze = '0' },
              @{ Page = 'gaming'; Light = '0'; Analyze = '0' },
              @{ Page = 'tweaks'; Light = '0'; Analyze = '0' },
              @{ Page = 'library'; Light = '0'; Analyze = '0'; Fixtures = '0' },
              @{ Page = 'library'; Light = '0'; Analyze = '0'; Fixtures = '1' },
              @{ Page = 'library'; Light = '1'; Analyze = '0'; Fixtures = '1' },
              @{ Page = 'vpn'; Light = '0'; Analyze = '0' },
              @{ Page = 'vpn'; Light = '1'; Analyze = '0' },
              @{ Page = 'hardware'; Light = '0'; Analyze = '0' },
              @{ Page = 'protection'; Light = '0'; Analyze = '0' },
              @{ Page = 'protection'; Light = '1'; Analyze = '0' }
            )
            $scenarios += 0..9 | ForEach-Object { @{ Page = 'mouselab'; Light = '0'; Analyze = '0'; MouseSection = "$_" } }
            foreach ($scenario in $scenarios) {
              $page = $scenario.Page
              $label = $page + $(if ($scenario.Light -eq '1') { '-light' } else { '' }) + $(if ($scenario.Fixtures -eq '1') { '-fixtures' } else { '' })
              if ($page -eq 'mouselab') { $label += '-' + $scenario.MouseSection }
              $env:NEXUS_MOUSE_LAB_SECTION = $scenario.MouseSection
              $env:NEXUS_SMOKE_LIGHT = $scenario.Light
              $env:NEXUS_SMOKE_ASSISTANT_READONLY = $scenario.Analyze
              $env:NEXUS_SMOKE_GAME_FIXTURES = $(if ($scenario.Fixtures -eq '1') { '1' } else { '0' })
              $env:NEXUS_DATA_DIR = Join-Path $env:GITHUB_WORKSPACE "artifacts/startup/$label"
              $env:NEXUS_SCREENSHOT_PAGE = $page
              New-Item -ItemType Directory -Path $env:NEXUS_DATA_DIR -Force | Out-Null
              $process = Start-Process -FilePath (Join-Path $env:GITHUB_WORKSPACE 'artifacts/app/Nexus.UI.exe') -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
              if (!$process.WaitForExit(45000)) { $process.Kill(); throw "Startup timed out: $page" }
              if ($process.ExitCode -ne 0) { throw "Startup failed: $page, exit $($process.ExitCode). See startup artifacts." }
              foreach ($file in @('dashboard.png', 'smoke-test.json')) {
                if (!(Test-Path (Join-Path $env:NEXUS_DATA_DIR $file))) { throw "Startup evidence missing: $page/$file" }
              }
              if ($scenario.Analyze -eq '1' -and !(Test-Path (Join-Path $env:NEXUS_DATA_DIR 'assistant-analysis.json'))) { throw 'Assistant evidence missing.' }
              if ($page -eq 'precision' -and !(Test-Path (Join-Path $env:NEXUS_DATA_DIR 'precision-readonly.json'))) { throw 'Precision evidence missing.' }
              if ($page -in @('library','vpn') -and !(Test-Path (Join-Path $env:NEXUS_DATA_DIR 'library-vpn-readonly.json'))) { throw 'Library/VPN evidence missing.' }
              if ($page -eq 'protection' -and !(Test-Path (Join-Path $env:NEXUS_DATA_DIR 'protection-readonly.json'))) { throw 'Protection read-only evidence missing.' }
              if ($page -eq 'mouselab') {
                $mouse = Get-Content (Join-Path $env:NEXUS_DATA_DIR 'mouselab-readonly.json') -Raw | ConvertFrom-Json
                if ($mouse.Result -ne 'PASS' -or $mouse.WindowsChanges -ne 0 -or $mouse.Capturing -or $mouse.Automation) { throw 'Mouse Lab read-only validation failed.' }
              }
              $result = Get-Content (Join-Path $env:NEXUS_DATA_DIR 'smoke-test.json') -Raw | ConvertFrom-Json
              if ($result.Width -lt 1366 -or $result.Height -lt 768) { throw "Rendered window too small: $page" }
            }
          } finally { [NexusHostedDesktop]::Restore() }
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Optimizer-win-x64-unsigned
          path: |
            artifacts/NEXUS-Optimizer-*-win-x64-unsigned.zip
            artifacts/SHA256SUMS.txt
            artifacts/distribution.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-1.0-unsigned-Store-candidate
          path: artifacts/store-candidate
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/tests
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-and-native-validation
          path: |
            artifacts/startup
            artifacts/native-preference-validation
            artifacts/native-mouse-validation
            artifacts/native-game-profile-validation
            artifacts/smart-boost-validation
          if-no-files-found: warn
  packaged-upgrade:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NEXUS-1.0-unsigned-Store-candidate
          path: artifacts/new-store
      - uses: actions/download-artifact@v4
        with:
          name: NEXUS-0.10-unsigned-Store-candidate
          run-id: 38961709553
          github-token: ${{ github.token }}
          path: artifacts/old-store
      - name: Verify exact old and new candidates, unpack and test a real binary upgrade
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $old = Get-ChildItem artifacts/old-store -Filter '*.msix' | Select-Object -First 1
          $new = Get-ChildItem artifacts/new-store -Filter '*.msix' | Select-Object -First 1
          if ((Get-FileHash $old.FullName).Hash -ne 'AB9EEB3105BFE2397BC2EFE7ED305992DD881C52C941132C501115C6D2D3716C') { throw 'Incorrect 0.10 candidate.' }
          $report = Get-Content artifacts/new-store/packaging-report.json -Raw | ConvertFrom-Json
          if ((Get-FileHash $new.FullName).Hash -ne $report.PackageSHA256) { throw 'Incorrect new candidate.' }
          $sdk = Get-ChildItem -LiteralPath (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin') -Directory | Where-Object Name -Match '^\d+\.\d+\.\d+\.\d+$' | Sort-Object { [version]$_.Name } -Descending | Where-Object { Test-Path (Join-Path $_.FullName 'x64/makeappx.exe') } | Select-Object -First 1
          foreach ($payload in @(@{Package=$old.FullName;Destination='artifacts/old-payload'},@{Package=$new.FullName;Destination='artifacts/new-payload'})) {
            & (Join-Path $sdk.FullName 'x64/makeappx.exe') unpack /p $payload.Package /d $payload.Destination /no
            if ($LASTEXITCODE -ne 0) { throw 'MSIX unpack failed.' }
            foreach ($name in @('AppxBlockMap.xml','[Content_Types].xml','AppxSignature.p7x')) {
              $path = Join-Path $env:GITHUB_WORKSPACE ($payload.Destination + '/' + $name)
              if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path }
            }
          }
          & ./StorePreparation/Test-StorePackage.ps1 -InitialContentDirectory artifacts/old-payload -ContentDirectory artifacts/new-payload -OutputDirectory artifacts/store-upgrade -InitialVersion '0.10.0.0' -UpdateVersion '1.0.0.0'
          $result = Get-Content artifacts/store-upgrade/packaged-validation.json -Raw | ConvertFrom-Json
          if ($result.Result -ne 'PASS' -or !$result.BinaryUpgradeVerified -or !$result.DataMigrationVerified -or !$result.Reinstalled -or !$result.PackagedWindowsPreferenceAndUndoVerified) { throw 'Real 0.10 upgrade checks failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS-1.0-real-0.10-upgrade-validation
          path: artifacts/store-upgrade
          if-no-files-found: warn
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, packaged-upgrade]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NEXUS-Optimizer-win-x64-unsigned
          path: artifacts
      - name: Create a draft experimental release without replacing previous assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $metadata = Get-Content artifacts/distribution.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_TAG -notmatch ('^v' + [regex]::Escape($metadata.Version) + '(-[A-Za-z0-9.-]+)?$')) { throw 'Tag and binary version differ.' }
          $notes = 'NEXOS Mouse Lab: foreground per-device Raw Input tests, local sensitivity calculators, reversible Windows mouse settings, profiles, five aim-training exercises and local history. Hardware DPI/polling/sensor controls require official manufacturer software. This archive is UNSIGNED; Windows App Control may block it. Store submission and Microsoft signing are separate. No physical latency, game performance or target-PC launch claims. Preserve the entire dependency folder. See MOUSE-LAB.md and distribution.json.'
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            throw 'Release already exists; no assets were replaced.'
          } else {
            gh release create $env:RELEASE_TAG "artifacts/$($metadata.Payload)" artifacts/SHA256SUMS.txt artifacts/distribution.json --verify-tag --draft --prerelease --title "NEXUS Optimizer $env:RELEASE_TAG (experimental, unsigned)" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
