name: Import reviewed NEXUS 0.8 source
on:
  push:
    branches: [nexus-v0.8-intelligence]
    paths: ['nexus-review-source-08.zip', '.github/workflows/import-source-08.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/nexus-v0.8-intelligence' && github.actor == 'joao01dinis-ctrl'
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and import the reviewed source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:GITHUB_WORKSPACE 'nexus-review-source-08.zip'
          if (!(Test-Path -LiteralPath $archive)) { Write-Host 'Source already imported.'; exit 0 }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '4769607DD277F2A3CC9D6E1AA42568E481152A9627A736ABBB70217D82CDB99F') { throw 'Source hash mismatch.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          $paths = [Collections.Generic.List[string]]::new()
          try {
            if ($zip.Entries.Count -ne 24) { throw 'Unexpected source inventory.' }
            foreach ($entry in $zip.Entries) {
              $parts = $entry.FullName.Replace('\','/').Split('/')
              if ($parts -contains '..' -or $parts -contains '.git' -or $parts -contains '.github' -or $parts -contains 'artifacts' -or $parts -contains 'bin' -or $parts -contains 'obj') { throw 'Unsafe source path.' }
              if ($entry.FullName -match '(^[\/]|:|(?i)\.(pfx|p12|pem|key|dll|exe|db|sqlite|zip)$)' -or $entry.FullName -match '(?i)(^|/)\.env' -or $entry.Length -gt 2097152) { throw 'Unexpected source content.' }
              $target = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE $entry.FullName))
              if (!$target.StartsWith($env:GITHUB_WORKSPACE + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'Source escapes checkout.' }
              [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($target)) | Out-Null
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $target, $true)
              $paths.Add($entry.FullName)
            }
          } finally { $zip.Dispose() }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $paths
          git rm -- nexus-review-source-08.zip
          git commit -m 'NEXUS 0.8: intuitive UI, constrained assistant and mouse preferences'
          if ($LASTEXITCODE -ne 0) { throw 'Source commit failed.' }
          git push origin HEAD:refs/heads/nexus-v0.8-intelligence
          if ($LASTEXITCODE -ne 0) { throw 'Review branch changed; refusing to overwrite it.' }
