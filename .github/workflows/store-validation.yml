name: Validate NEXUS 0.7 Microsoft Store package
on:
  push:
    branches: [nexus-v0.6-direct-workflow]
    paths: ['nexus-store-source-07.zip', '.github/workflows/store-validation.yml', 'StorePreparation/**', 'src/**']
  workflow_dispatch:
concurrency:
  group: nexus-store-validation
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  store:
    if: github.ref == 'refs/heads/nexus-v0.6-direct-workflow' && github.actor == 'joao01dinis-ctrl'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify and import the reviewed source snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:GITHUB_WORKSPACE 'nexus-store-source-07.zip'
          if (Test-Path -LiteralPath $archive) {
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '995C21774CF403A49BABA8ABC7A07122919DC42415562666E75D903FCEC72697') { throw 'Source snapshot hash mismatch.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            if ($zip.Entries.Count -lt 60 -or $zip.Entries.Count -gt 300) { throw 'Unexpected source inventory.' }
            foreach ($entry in $zip.Entries) {
              $parts = $entry.FullName.Replace('\','/').Split('/')
              if ($parts -contains '..' -or $parts -contains '.git' -or $parts -contains 'artifacts' -or $parts -contains 'bin' -or $parts -contains 'obj') { throw 'Unsafe source path.' }
              if ($entry.FullName -match '(^[\/]|:|(?i)\.(pfx|p12|pem|key|dll|exe|db|sqlite|zip)$)' -or $entry.Length -gt 2097152) { throw 'Unexpected source content.' }
              $target = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE $entry.FullName))
              if (-not $target.StartsWith($env:GITHUB_WORKSPACE + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'Source escapes the checkout.' }
              [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($target)) | Out-Null
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $target, $true)
            }
          } finally { $zip.Dispose() }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git rm nexus-store-source-07.zip
          git commit -m 'Prepare NEXUS 0.7 source and scoped Microsoft Store packaging'
          if ($LASTEXITCODE -ne 0) { throw 'Source commit failed.' }
          git push origin HEAD:refs/heads/nexus-v0.6-direct-workflow
          if ($LASTEXITCODE -ne 0) { throw 'Review branch changed; refusing to overwrite it.' }
          }
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore NexusOptimizer.sln --configfile NuGet.Config
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build NexusOptimizer.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
      - name: Tests
        shell: pwsh
        run: |
          dotnet test src/Nexus.Tests/Nexus.Tests.csproj -c Release --no-build --logger 'trx;LogFileName=store-tests.trx' --results-directory artifacts/tests
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          [xml]$trx = Get-Content artifacts/tests/store-tests.trx -Raw
          if ([int]$trx.TestRun.ResultSummary.Counters.executed -lt 150) { throw 'Expected test coverage was not executed.' }
      - name: Native preference round-trip on the disposable runner
        env:
          NEXUS_TEST_NATIVE_PREFERENCE: '1'
        run: dotnet test src/Nexus.Tests/Nexus.Tests.csproj -c Release --no-build --filter FullyQualifiedName~NativePreferenceTests --logger 'trx;LogFileName=native-store-tests.trx' --results-directory artifacts/tests
      - name: Publish the complete payload
        shell: pwsh
        run: |
          dotnet publish src/Nexus.UI/Nexus.UI.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/app-store
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed.' }
          Copy-Item -Path '*.md' -Destination artifacts/app-store
          Copy-Item -LiteralPath LICENSE -Destination artifacts/app-store
      - name: Build the real Store draft (never the test identity)
        shell: pwsh
        run: |
          $identity = Import-PowerShellDataFile StorePreparation/PartnerCenterIdentity.psd1
          & StorePreparation/Build-StorePackage.ps1 -IdentityName $identity.IdentityName -Publisher $identity.Publisher -PublisherDisplayName $identity.PublisherDisplayName -AppDisplayName $identity.AppDisplayName -PartnerCenterIdentityConfirmed -SourceDirectory (Join-Path $env:GITHUB_WORKSPACE 'artifacts/app-store')
          if (-not $?) { throw 'Store packaging failed.' }
      - name: Install, launch, update, uninstall and reinstall the identical payload with an isolated test identity
        shell: pwsh
        run: |
          $draft = Get-ChildItem StorePreparation/builds -Directory -Filter 'Store-Draft-*' | Select-Object -First 1
          & StorePreparation/Test-StorePackage.ps1 -ContentDirectory (Join-Path $draft.FullName 'content') -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'artifacts/store-validation')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS-0.7-Store-package-and-validation
          path: |
            StorePreparation/builds/**/NEXUS-*-UNSIGNED-STORE-DRAFT.msix
            StorePreparation/builds/**/packaging-report.json
            StorePreparation/builds/**/makeappx-validation.log
            StorePreparation/builds/**/makepri-package.log
            artifacts/store-validation/packaged-validation.json
            artifacts/store-validation/makeappx-test-*.log
            artifacts/store-validation/screenshots
            artifacts/store-validation/startup-diagnostics
            artifacts/tests
            artifacts/native-preference-validation
            artifacts/smart-boost-validation
          if-no-files-found: error
          retention-days: 14

